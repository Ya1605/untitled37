<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup Form</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<form class="form">
  <h1>Sign Up to get more Updates</h1>
  <div class="field">
    <label for="fullname">Full name *</label>
    <input type="text" id="fullname" placeholder="Your full name" required />
    <span class="error">Please enter correct data</span>
  </div>
  <div class="field">
    <label for="email">E-mail *</label>
    <input type="email" id="email" placeholder="Your e-mail" required />
  </div>
  <div class="field">
    <label for="phone">Phone number *</label>
    <input type="tel" id="phone" placeholder="(123) --- ----" required />
  </div>
  <div class="field">
    <label for="country">Country *</label>
    <select id="country" required>
      <option value="">Your country</option>
      <option value="us">US</option>
      <option value="uk">UK</option>
    </select>
  </div>
  <div class="field">
    <label for="city">City *</label>
    <input type="text" id="city" placeholder="Your city" required />
  </div>
  <div class="field">
    <label for="zip">Zip code *</label>
    <input type="text" id="zip" placeholder="---" required />
  </div>
  <div class="checkbox">
    <label><input type="checkbox" /> I want to receive news, advice and marketing offers from Nestlé</label>
  </div>
  <div class="checkbox">
    <label><input type="checkbox" /> I want to receive a newsletter about price changes</label>
  </div>
  <div class="checkbox">
    <label><input type="checkbox" /> I allow to use my data to personalize content and marketing activities</label>
  </div>
  <button type="submit">Create a profile</button>
</form>
</body>
</html>
